<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1226"/>
      <stop offset="1" stop-color="#4A2E12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="80" y="118" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="6" fill="#FBBF24" font-weight="bold">LIGHTSPEED · CLS</text>
  <text x="76" y="268" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="bold" fill="#ffffff">CLS</text>
  <text x="80" y="340" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#FDE68A">Cumulative Layout Shift</text>
  <text x="80" y="392" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FBBF24">Zéro décalage visuel</text>
  <rect x="80" y="424" width="250" height="64" rx="32" fill="#F59E0B"/>
  <text x="205" y="467" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1A1206" text-anchor="middle">≤ 0,1</text>
  <!-- Blocs : fantôme pointillé + bloc décalé -->
  <g>
    <rect x="700" y="170" width="320" height="86" rx="16" fill="none" stroke="#FBBF24" stroke-width="6" stroke-dasharray="18 14" opacity="0.8"/>
    <rect x="700" y="170" width="320" height="86" rx="16" fill="#F59E0B" opacity="0.25"/>
    <rect x="760" y="286" width="320" height="86" rx="16" fill="none" stroke="#ffffff" stroke-width="12"/>
    <rect x="700" y="402" width="320" height="86" rx="16" fill="none" stroke="#3B4670" stroke-width="10"/>
    <rect x="700" y="402" width="200" height="22" rx="11" fill="#ffffff" opacity="0.25"/>
    <g stroke="#FBBF24" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="1060" y1="300" x2="1110" y2="300"/>
      <polyline points="1092,282 1112,300 1092,318"/>
    </g>
  </g>
  <rect x="0" y="614" width="1200" height="16" fill="#F59E0B"/>

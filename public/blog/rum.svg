  <text x="80" y="340" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#FEF08A">Real User Monitoring</text>
  <text x="80" y="392" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FDE047">Vos données terrain en 20 min</text>
  <rect x="80" y="424" width="260" height="60" rx="30" fill="#EAB308"/>
  <text x="210" y="465" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#332700" text-anchor="middle">p75 par page</text>

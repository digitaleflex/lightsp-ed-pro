  <text x="80" y="340" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#A7F3D0">Interaction to Next Paint</text>
  <text x="80" y="392" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#34D399">Chaque clic instantané</text>
